# CI (Entscheidung 9.1): bei jedem Push und Pull Request
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgres://teachinghub:teachinghub@localhost:5432/teachinghub2
  PAYLOAD_SECRET: ci-only-not-secret-0123456789abcdef
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  BETTER_AUTH_SECRET: ci-only-not-secret-auth-0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3000
  # Tests senden mehrere Anmeldelinks hintereinander (inkl. Wiederholungen)
  AUTH_RATE_LIMIT: 'off'
  MAILPIT_URL: http://localhost:8025
  # Ask-a-question (Phase 6): Embeddings und Antworten ohne externe Dienste
  AI_EMBEDDER: fake
  AI_TEST_PROVIDER: '1'
  AI_KEY_SECRET: ci-only-not-secret-ai-key-0123456789abcdef

jobs:
  check:
    name: Lint, Typen, Tests, Build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: teachinghub
          POSTGRES_PASSWORD: teachinghub
          POSTGRES_DB: teachinghub2
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U teachinghub -d teachinghub2"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        # Fängt die Anmeldelinks ab (E2E der Mitgliederkonten)
        image: axllent/mailpit:v1.34.0
        ports: ['1025:1025', '8025:8025']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Test-Anmeldedienst für edu-ID (Phase 7) früh starten; die E2E-Tests warten unten auf ihn
      - name: Test-Anmeldedienst (Keycloak) starten
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/docker/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.8.1 start-dev --import-realm --http-port 8080

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typprüfung
        run: npm run typecheck

      - name: Unit-Tests
        run: npm run test:unit

      - name: Migrationen auf leerer Datenbank anwenden
        run: |
          npm run migrate
          npm run auth:migrate

      # Integrationstests auf eigener DB: sie passen das Schema im Dev-Modus an (Schema-Push).
      # Die E2E-DB bleibt rein migriert – sonst fragt der Produktionsserver beim Start nach und hängt.
      - name: Integrationstests (Payload + PostgreSQL)
        env:
          DATABASE_URL: postgres://teachinghub:teachinghub@localhost:5432/teachinghub2_int
        run: |
          node scripts/ci/create-db.mjs "$DATABASE_URL"
          npm run auth:migrate
          npm run test:int

      - name: Testinhalte für E2E einspielen
        env:
          NODE_ENV: production
        run: |
          npm run e2e:fixtures
          npm run ai:reindex

      - name: Build
        run: npm run build

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Auf den Test-Anmeldedienst warten
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/eduid-test/.well-known/openid-configuration >/dev/null && exit 0
            sleep 3
          done
          docker logs keycloak
          exit 1

      - name: E2E- und Barrierefreiheitstests (axe)
        env:
          EDUID_DISCOVERY_URL: http://localhost:8080/realms/eduid-test/.well-known/openid-configuration
          EDUID_CLIENT_ID: teachinghub2
          EDUID_CLIENT_SECRET: teachinghub2-test-secret
          E2E_EDUID: '1'
        run: npm run test:e2e

      - name: Playwright-Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

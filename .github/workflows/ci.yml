# CI (Entscheidung 9.1): bei jedem Push und Pull Request
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgres://teachinghub:teachinghub@localhost:5432/teachinghub2
  PAYLOAD_SECRET: ci-only-not-secret-0123456789abcdef
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  SMTP_HOST: localhost
  SMTP_PORT: '1025'

jobs:
  check:
    name: Lint, Typen, Tests, Build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: teachinghub
          POSTGRES_PASSWORD: teachinghub
          POSTGRES_DB: teachinghub2
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U teachinghub -d teachinghub2"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typprüfung
        run: npm run typecheck

      - name: Unit-Tests
        run: npm run test:unit

      - name: Migrationen auf leerer Datenbank anwenden
        run: npm run migrate

      - name: Integrationstests (Payload + PostgreSQL)
        run: npm run test:int

      - name: Testinhalte für E2E einspielen
        run: npm run e2e:fixtures

      - name: Build
        run: npm run build

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E- und Barrierefreiheitstests (axe)
        run: npm run test:e2e

      - name: Playwright-Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

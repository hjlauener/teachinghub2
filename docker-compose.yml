# Lokaler Entwicklungs-Stack (Entscheidung 1.2): App, PostgreSQL (+pgvector), Mailpit.
# Start:  docker compose up        → http://localhost:3000  (Admin: /admin, Mails: http://localhost:8025)
# Node.js wird nicht auf dem Mac benötigt – alles läuft in Containern.

name: teachinghub2

services:
  app:
    image: node:24.22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run auth:migrate && npm run dev"
    env_file: .env
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      WATCHPACK_POLLING: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    # PostgreSQL 17 mit pgvector (für Ask-a-question ab Phase 6, Entscheidung 8.6)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: teachinghub
      POSTGRES_PASSWORD: teachinghub
      POSTGRES_DB: teachinghub2
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teachinghub -d teachinghub2']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # Fängt alle ausgehenden Mails ab (Magic Links ab Phase 4, Entscheidung 6.1)
    image: axllent/mailpit:v1.34.0
    ports:
      - '127.0.0.1:8025:8025'

  # End-to-End-Tests gegen die laufende App: docker compose --profile e2e run --rm e2e
  e2e:
    profiles: ['e2e']
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund --ignore-scripts && npx playwright test"
    # Gleiches Netzwerk wie die App: localhost:3000 ist hier die App (wie im Browser) –
    # nötig, weil die Anmeldung auf die öffentliche Adresse (BETTER_AUTH_URL) zurückleitet.
    network_mode: 'service:app'
    environment:
      E2E_BASE_URL: http://localhost:3000
      # Lokal gegen die importierten Altsite-Inhalte testen (CI nutzt künstliche Testseiten)
      E2E_REAL_DATA: '1'
      MAILPIT_URL: http://mailpit:8025
      CI: '1'
    volumes:
      - .:/app
      - node_modules_e2e:/app/node_modules
    depends_on:
      - app

volumes:
  pgdata:
  node_modules:
  node_modules_e2e:
  next_cache:
